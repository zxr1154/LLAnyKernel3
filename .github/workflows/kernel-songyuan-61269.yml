name: songyuan 6.12.69 固定源码构建

# 通用 kernel-custom.yml 的 workflow_dispatch 已有 25 个输入，不能再加 gki_commit。
# 这条工作流只服务这次设备源码固定构建，并把该提交放进表单。

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      kernelsu_variant:
        description: "KernelSU 变体"
        required: true
        type: choice
        options:
          - SukiSU-Nova
        default: SukiSU-Nova
      build_channel:
        description: "构建管理器通道"
        required: false
        type: choice
        options:
          - "正式 (Release)"
          - "最新 (HEAD)"
        default: "正式 (Release)"
      version:
        description: "自定义内核版本名"
        required: false
        type: string
        default: "android16-6-g0a1dc0413ec7-ab16271006-4k"
      build_time:
        description: "自定义构建时间（Sep 与 5 之间两个空格）"
        required: false
        type: string
        default: "Sat Sep  5 12:19:39 UTC 2026"
      gki_commit:
        description: "固定 kernel/common 的 40 位提交。这只改源码基线，不改版本名。"
        required: true
        type: string
        default: "0a1dc0413ec7f42ad5924505ca2a519900ccf770"
      ksu_mode:
        description: "KernelSU / SUSFS 模式"
        required: true
        type: choice
        options:
          - "关闭"
          - "禁用SUSFS"
          - "禁用KSU"
        default: "关闭"
      use_kpm:
        description: "KPM 功能（仅 SukiSU-Nova）"
        required: false
        type: boolean
        default: true
      use_bbg:
        description: "启用 BBG 基带保护"
        required: true
        type: boolean
        default: true
      use_net_enhance:
        description: "启用网络增强"
        required: true
        type: boolean
        default: true
      use_rekernel:
        description: "启用 Re-Kernel"
        required: false
        type: boolean
        default: true
      use_nomount:
        description: "启用 NoMount 挂载元模块（另附配套模块）"
        required: false
        type: boolean
        default: true
      cve_2026_43499_patch:
        description: "应用 CVE-2026-43499"
        required: false
        type: boolean
        default: true
      supp_op:
        description: "启用一加骁龙 8 Elite/Gen5 支持"
        required: false
        type: boolean
        default: false
      skip_incompatible:
        description: "功能不兼容时自动跳过"
        required: false
        type: boolean
        default: false
      droidspaces:
        description: "Droidspaces"
        required: false
        type: choice
        options:
          - "off"
          - "678"
          - "123"
          - "345"
          - "678 (NTSync)"
          - "123 (NTSync)"
          - "345 (NTSync)"
        default: "off"
      artifact_upload_mode:
        description: "构建产物上传模式"
        required: true
        type: choice
        options:
          - "仅上传 AnyKernel3.zip"
          - "上传全部"
        default: "上传全部"

jobs:
  get-ksu-manager:
    uses: ./.github/workflows/get-manager.yml
    secrets: inherit
    with:
      kernelsu_variant: ${{ inputs.kernelsu_variant }}
      build_channel: ${{ inputs.build_channel }}
      ksu_mode: ${{ inputs.ksu_mode }}
      use_nomount: ${{ inputs.use_nomount || false }}
      # OS4.0.8.0 vendor zsmalloc/node_cache use a different zs_malloc ABI.
      # Keep the stock vendor modules instead of shipping ACK replacements.
      use_zram: false
      use_bbg: ${{ inputs.use_bbg }}
      use_net_enhance: ${{ inputs.use_net_enhance }}
      use_rekernel: ${{ inputs.use_rekernel }}
      use_kpm: ${{ inputs.use_kpm }}
      cve_2026_43499_patch: ${{ inputs.cve_2026_43499_patch }}
      skip_incompatible: ${{ inputs.skip_incompatible || false }}
      droidspaces: ${{ startsWith(inputs.droidspaces, '678') && '678' || startsWith(inputs.droidspaces, '123') && '123' || startsWith(inputs.droidspaces, '345') && '345' || 'off' }}
      droidspaces_ntsync: ${{ contains(inputs.droidspaces, 'NTSync') }}
      artifact_upload_mode: ${{ inputs.artifact_upload_mode }}
      version: ${{ inputs.version || '' }}
      build_time: ${{ inputs.build_time || '' }}

  build:
    needs: get-ksu-manager
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      android_version: android16
      kernel_version: "6.12"
      sub_level: "69"
      os_patch_level: "2026-03"
      revision: "r1"
      ksu_variant: ${{ inputs.kernelsu_variant }}
      build_channel: ${{ inputs.build_channel }}
      ksu_commit: ${{ needs.get-ksu-manager.outputs.ksuCommit }}
      ksu_cert_size: ${{ needs.get-ksu-manager.outputs.managerCertSize }}
      ksu_cert_hash: ${{ needs.get-ksu-manager.outputs.managerCertHash }}
      version: ${{ inputs.version || '' }}
      build_time: ${{ inputs.build_time || '' }}
      gki_commit: ${{ inputs.gki_commit }}
      preserve_songyuan_modules: true
      use_zram: false
      use_bbg: ${{ inputs.use_bbg }}
      use_net_enhance: ${{ inputs.use_net_enhance }}
      use_kpm: ${{ inputs.use_kpm || false }}
      use_rekernel: ${{ inputs.use_rekernel || false }}
      use_nomount: ${{ inputs.use_nomount || false }}
      cve_2026_43499_patch: ${{ inputs.cve_2026_43499_patch }}
      supp_op: ${{ inputs.supp_op || false }}
      enable_susfs: ${{ inputs.ksu_mode != '禁用SUSFS' && inputs.ksu_mode != '禁用KSU' }}
      ksu_mode: ${{ inputs.ksu_mode }}
      droidspaces: ${{ startsWith(inputs.droidspaces, '678') && '678' || startsWith(inputs.droidspaces, '123') && '123' || startsWith(inputs.droidspaces, '345') && '345' || 'off' }}
      droidspaces_ntsync: ${{ contains(inputs.droidspaces, 'NTSync') }}
      artifact_upload_mode: ${{ inputs.artifact_upload_mode }}
      skip_incompatible: ${{ inputs.skip_incompatible || false }}
