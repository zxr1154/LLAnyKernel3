name: songyuan 6.12.69 - 截图功能组合

on:
  workflow_dispatch:

# Separate from the successful stock-trust baseline: these extra patches
# change the kernel and require a new build and on-device validation.
permissions:
  contents: write
  actions: write

jobs:
  build-songyuan:
    uses: ./.github/workflows/build.yml
    with:
      android_version: android16
      kernel_version: "6.12"
      sub_level: "69"
      os_patch_level: "2026-03"
      revision: r1
      ksu_variant: SukiSU
      version: "6.12.69-android16-6-g014ca48a80ee-ab15889839-4k"
      build_time: "Fri Jul 17 18:06:00 UTC 2026"
      use_zram: true
      use_bbg: true
      use_net_enhance: true
      use_kpm: "patched (开启并修补)"
      use_rekernel: false
      cve_2026_43499_patch: false
      # User clarification: keep SUSFS OFF and the existing official main commit.
      enable_susfs: false
      supp_op: true
      # Droidspaces is cropped out of the screenshot; keep its existing OFF state.
      droidspaces: "off"
      droidspaces_ntsync: false
      skip_incompatible: false
      artifact_upload_mode: "仅上传 AnyKernel3.zip"
      stock_gki_profile: songyuan-os4.0.0.10-features
