name: Update GKI Kernel Data

on:
  schedule:
    - cron: '0 8 */3 * *'  # 每 3 天 UTC 8:00
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - 'data/**'
      - 'scripts/**'

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-24.04
    steps:
      # 配置了 WORKFLOW_PUSH_TOKEN（带 workflow 权限的 PAT）时，用它检出并推送
      # data/ 与 workflow 选择/矩阵。未配置时回退 GITHUB_TOKEN：它不能修改
      # .github/workflows，提交步骤会只推送 data/ 并写明原因。
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.WORKFLOW_PUSH_TOKEN || github.token }}

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Run incremental update
        working-directory: scripts
        run: |
          # Exit 0 = data changed, 2 = no changes, 1 = real error
          python update_data.py && exit_code=0 || exit_code=$?
          if [ $exit_code -eq 1 ]; then
            echo "::error::update_data.py failed with an error"
            exit 1
          fi

      - name: Refresh custom workflow choices
        working-directory: scripts
        run: python update_workflow_choices.py

      - name: Commit data changes
        env:
          HAS_WORKFLOW_PUSH_TOKEN: ${{ secrets.WORKFLOW_PUSH_TOKEN != '' }}
        run: bash scripts/ci/publish_data_update.sh
